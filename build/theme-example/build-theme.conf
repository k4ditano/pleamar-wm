# Build's look and how it starts: in ~/.config/pleamar/ (or $PLEAMAR_CONFIG), next to build.conf.
# `key = value` or `key value`, one a line. Read each time Build starts. docs/build-theme.md.

# The family of every word. Installed, or a .ttf/.otf next to theme.plm in build-theme/.
# Empty or missing: the default one, as ever.
font =

# Every corner this much rounder (0.5 to 2).
corners = 1

# The bar and the panel of glass, tinted with the theme's `coal`.
glass = off

# draw: Super+B starts drawing, as ever. panel: it asks first what to build, in the middle,
# as a search does, and drawing is a press away. (In build.conf too, where it has the last word.)
start = draw
