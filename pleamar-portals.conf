# The portals in pleamar-wm's session (XDG_CURRENT_DESKTOP=pleamar): sharing
# the screen, screenshots and programs' global shortcuts are the session's
# own (pleamar.portal, answered by pleamar-wm); everything else (files,
# settings), GTK's, except the file dialogs (Open, Save as): Sonda's (the Finder of
# Bahía, sonda.portal) when it is installed, and GTK's when it is not or does not answer.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=pleamar
org.freedesktop.impl.portal.Screenshot=pleamar
org.freedesktop.impl.portal.GlobalShortcuts=pleamar
org.freedesktop.impl.portal.FileChooser=sonda;gtk;
