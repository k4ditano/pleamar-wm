<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1114">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="robots" content="noindex">
<title>Caravan</title>
<style>
  /* The caravan (remote.rs, /caravan): the session's agents without the
     desktop's picture. Same sea as the remote page; text set for a phone. */
  :root {
    --bg: #0b1114; --panel: #12191d; --raise: #172126; --line: #23313a; --ink: #e6f1f0; --faint: #8aa0a6; --dim: #5d7177;
    --sea: #4fd1c5; --sea-ink: #062421; --amber: #f2b45a; --bad: #ff8a80;
    --serif: ui-serif, "Newsreader", "Iowan Old Style", Georgia, serif;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  body { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .view { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
  #talk { transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); z-index: 2; box-shadow: -12px 0 30px #0008; }
  body.in-talk #talk { transform: none; }
  body.in-talk #home { transform: translateX(-18%); opacity: .4; transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s; }
  #home { transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s; }

  header { display: flex; align-items: center; gap: 10px; padding: calc(12px + var(--safe-t)) 16px 10px; }
  header h1 { margin: 0; font: 500 26px/1.1 var(--serif); letter-spacing: -.01em; flex: 1; }
  header .host { display: block; font: 12px/1.3 system-ui, sans-serif; color: var(--faint); letter-spacing: 0; margin-top: 2px; }
  .pill-btn { text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 13px; color: var(--ink); background: var(--panel); white-space: nowrap; }
  .pill-btn:active { background: var(--raise); }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 16px calc(24px + var(--safe-b)); }

  h2 { font: 600 11.5px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 18px 4px 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .card.needs { border-color: color-mix(in srgb, var(--amber) 45%, var(--line)); background: color-mix(in srgb, var(--amber) 6%, var(--panel)); }
  .who { display: flex; align-items: center; gap: 10px; }
  .who b { font-weight: 600; }
  .who .meta { color: var(--faint); font-size: 13px; }
  .what { margin: 10px 0 0; font: 13px/1.45 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; white-space: pre-wrap; word-break: break-word; max-height: 9.5em; overflow: auto; }
  .q { margin: 10px 0 0; font-size: 15px; }
  .row-btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { flex: 1 1 auto; min-height: 42px; border-radius: 12px; padding: 9px 14px; font-weight: 600; font-size: 14px; background: var(--raise); border: 1px solid var(--line); }
  .btn.go { background: var(--sea); color: var(--sea-ink); border-color: var(--sea); }
  .btn.no { color: var(--bad); }
  .btn:disabled { opacity: .45; }
  .btn:active:not(:disabled) { filter: brightness(1.15); }
  .opt { flex: 1 1 100%; text-align: left; }

  .glyph { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.5px; width: 22px; height: 22px; flex: none; }
  .glyph i { border-radius: 1.5px; background: currentColor; opacity: .12; }
  .glyph i.on { opacity: .95; }
  .avatar { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, currentColor 13%, var(--raise)); position: relative; }
  .avatar .dot { position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 6px; border: 2.5px solid var(--bg); background: var(--dim); }
  .s-free .dot { background: var(--sea); }
  .s-working .dot { background: var(--sea); animation: beat 1.4s ease-in-out infinite; }
  .s-asking .dot { background: var(--amber); animation: beat 1s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(.7); opacity: .6; } }

  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .comp { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .comp:last-child { border-bottom: 0; }
  .comp:active { background: var(--raise); }
  .comp .body { flex: 1; min-width: 0; }
  .comp .top { display: flex; align-items: baseline; gap: 8px; }
  .comp .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comp .state { font-size: 12.5px; color: var(--faint); white-space: nowrap; margin-left: auto; }
  .s-asking .state { color: var(--amber); }
  .s-working .state { color: var(--sea); }
  .comp .line { color: var(--faint); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .badge { font-size: 11.5px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; padding: 0 6px; display: inline-grid; place-items: center; background: var(--raise); border: 1px solid var(--line); color: var(--ink); }
  .empty { color: var(--faint); text-align: center; padding: 36px 20px; font-size: 14px; }
  .empty b { display: block; font: 500 20px/1.2 var(--serif); color: var(--ink); margin-bottom: 6px; }
  .note { color: var(--faint); font-size: 12.5px; text-align: center; margin: 16px 8px 0; }

  /* A conversation. */
  #talk header { gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .back { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; font-size: 22px; margin-left: -6px; }
  .back:active { background: var(--raise); }
  #t-title { flex: 1; min-width: 0; }
  #t-name { font: 500 20px/1.15 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #t-state { font-size: 12.5px; color: var(--faint); }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 2px; margin: 10px 16px 0; }
  .seg button { flex: 1; padding: 6px; border-radius: 8px; font-size: 13px; color: var(--faint); }
  .seg button.on { background: var(--raise); color: var(--ink); font-weight: 600; }
  #chat { padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .day { align-self: center; font-size: 11.5px; color: var(--dim); margin: 10px 0 4px; }
  .bub { max-width: 86%; padding: 9px 13px; border-radius: 18px; white-space: pre-wrap; word-break: break-word; font-size: 15px; position: relative; }
  .bub.me { align-self: flex-end; background: color-mix(in srgb, var(--sea) 22%, var(--raise)); border-bottom-right-radius: 6px; }
  .bub.me.waiting { background: var(--panel); border: 1px dashed var(--line); color: var(--faint); }
  .bub.them { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .bub.them.bad { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
  .bub .from { display: block; font-size: 11.5px; font-weight: 600; color: var(--faint); margin-bottom: 2px; }
  .bub .pic { display: block; margin-top: 8px; }
  .bub .pic img { display: block; max-width: 100%; max-height: 260px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
  .bub .more { display: block; margin-top: 6px; color: var(--sea); font-size: 13px; font-weight: 600; }
  .stamp { font-size: 11px; color: var(--dim); margin: 0 6px 6px; }
  .stamp.me { align-self: flex-end; }
  .stamp.them { align-self: flex-start; }
  .wbtns { align-self: flex-end; display: flex; gap: 12px; margin: -2px 6px 6px; font-size: 12.5px; }
  .wbtns button { color: var(--sea); font-weight: 600; }
  .wbtns button.no { color: var(--bad); }
  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 13px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; border-bottom-left-radius: 6px; }
  .typing i { width: 7px; height: 7px; border-radius: 4px; background: var(--faint); animation: dots 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes dots { 0%, 60%, 100% { opacity: .25; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
  #asks { margin: 10px 0 2px; }
  #screen { margin: 12px 0 0; font: 11.5px/1.35 var(--mono); white-space: pre; overflow-x: auto; background: #070b0d; border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-height: 50vh; color: #cfe0de; }
  .screen-note { color: var(--dim); font-size: 12px; margin-top: 8px; text-align: center; }

  footer { border-top: 1px solid var(--line); background: var(--bg); padding: 8px 12px calc(8px + var(--safe-b)); }
  .tools { display: flex; gap: 8px; margin-bottom: 8px; overflow-x: auto; }
  .tools:empty { display: none; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; white-space: nowrap; }
  .chip.no { color: var(--bad); }
  .compose { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; max-height: 9.5em; min-height: 42px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 21px; padding: 10px 15px; font: inherit; font-size: 16px; line-height: 1.35; outline: none; }
  textarea:focus { border-color: color-mix(in srgb, var(--sea) 60%, var(--line)); }
  .send { width: 42px; height: 42px; border-radius: 21px; background: var(--sea); color: var(--sea-ink); display: grid; place-items: center; flex: none; }
  .send:disabled { background: var(--raise); color: var(--dim); }
  .send svg { width: 20px; height: 20px; }
  .watch-only { color: var(--faint); font-size: 13px; text-align: center; padding: 6px; }

  #toast { position: fixed; left: 50%; bottom: calc(86px + var(--safe-b)); transform: translateX(-50%) translateY(8px); background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font-size: 13.5px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 5; max-width: calc(100vw - 32px); width: max-content; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #offline { display: none; position: fixed; top: calc(8px + var(--safe-t)); left: 50%; transform: translateX(-50%); z-index: 6; background: var(--raise); border: 1px solid var(--line); color: var(--amber); font-size: 12.5px; padding: 5px 12px; border-radius: 999px; }
  body.offline #offline { display: block; }
  /* Notices: the bell, and its sheet from the bottom. */
  .bell { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; position: relative; }
  .bell svg { width: 18px; height: 18px; }
  .bell.on::after { content: ""; position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 4px; background: var(--sea); border: 2px solid var(--panel); }
  #scrim { position: fixed; inset: 0; background: #0009; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 7; }
  #scrim.show { opacity: 1; pointer-events: auto; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--panel); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 10px 20px calc(22px + var(--safe-b)); transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); max-width: 560px; margin: 0 auto; }
  #sheet.show { transform: none; }
  #sheet .grip { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
  #sheet h3 { margin: 0 0 6px; font: 500 24px/1.15 var(--serif); }
  #sheet p { margin: 0 0 14px; color: var(--faint); font-size: 14px; }
  .switch { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .switch span { flex: 1; } .switch small { display: block; color: var(--faint); font-size: 12.5px; margin-top: 2px; }
  .switch input { appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--raise); border: 1px solid var(--line); position: relative; flex: none; transition: background .2s; margin: 0; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 10px; background: var(--faint); transition: transform .2s, background .2s; }
  .switch input:checked { background: var(--sea); border-color: var(--sea); }
  .switch input:checked::after { transform: translateX(18px); background: var(--sea-ink); }
  .switch input:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
  #sheet .row-btns { margin-top: 16px; }
  @media (min-width: 760px) {
    .scroll, #talk footer > * { max-width: 680px; margin-left: auto; margin-right: auto; width: 100%; }
    #talk .seg { max-width: 648px; margin-left: auto; margin-right: auto; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="offline"></div>

<section id="home" class="view">
  <header>
    <h1><span data-t="Caravan">Caravan</span><span class="host" id="host"></span></h1>
    <button class="pill-btn bell" id="bell" aria-label="Notices" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
    <a class="pill-btn" href="/?desk" id="to-desk" data-t="Desktop">Desktop</a>
    <form method="post" action="/logout" style="margin:0"><button class="pill-btn" data-t="Sign out">Sign out</button></form>
  </header>
  <div class="scroll">
    <div id="needs"></div>
    <h2 data-t="Companions">Companions</h2>
    <div id="list" class="list"></div>
    <p class="note" id="watch-note" hidden data-t="This page only watches: it shows everything but does nothing.">This page only watches: it shows everything but does nothing.</p>
  </div>
</section>

<section id="talk" class="view" aria-hidden="true">
  <header>
    <button class="back" id="back" aria-label="Back">‹</button>
    <div class="avatar" id="t-av"></div>
    <div id="t-title"><div id="t-name"></div><div id="t-state"></div></div>
  </header>
  <div class="seg" role="tablist">
    <button class="on" id="tab-chat" data-t="Conversation">Conversation</button>
    <button id="tab-screen" data-t="Screen">Screen</button>
  </div>
  <div class="scroll" id="t-scroll">
    <div id="asks"></div>
    <div id="chat"></div>
    <div id="screen-wrap" hidden><pre id="screen"></pre><div class="screen-note" data-t="Its terminal, as text: the last 80 lines.">Its terminal, as text: the last 80 lines.</div></div>
  </div>
  <footer id="t-foot">
    <div class="tools" id="tools"></div>
    <div class="compose">
      <textarea id="box" rows="1" enterkeyhint="send"></textarea>
      <button class="send" id="send" disabled aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </footer>
</section>
<div id="scrim"></div>
<section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" aria-hidden="true">
  <div class="grip"></div>
  <h3 id="sh-title" data-t="Notices">Notices</h3>
  <p id="sh-text"></p>
  <div id="sh-on" hidden>
    <label class="switch"><span><span data-t="Only when I am not at the computer">Only when I am not at the computer</span><small data-t="Two minutes without touching it. What needed you meanwhile comes when you leave.">Two minutes without touching it. What needed you meanwhile comes when you leave.</small></span><input type="checkbox" role="switch" id="sw-away" checked></label>
    <label class="switch"><span><span data-t="Also when one finishes">Also when one finishes</span><small data-t="Not only when they need you: when they answer a letter too.">Not only when they need you: when they answer a letter too.</small></span><input type="checkbox" role="switch" id="sw-done"></label>
  </div>
  <div class="row-btns">
    <button class="btn" id="sh-close" data-t="Close">Close</button>
    <button class="btn" id="sh-test" hidden data-t="Try it">Try it</button>
    <button class="btn no" id="sh-off" hidden data-t="Turn off">Turn off</button>
    <button class="btn go" id="sh-go" hidden data-t="Turn notices on">Turn notices on</button>
  </div>
</section>
<div id="toast"></div>

<script>
(() => {
  'use strict';
  const WATCH = {{WATCH}};
  const ES = /^es\b/i.test(navigator.language || '');
  const T = {
    'Caravan': 'Caravana', 'Desktop': 'Escritorio', 'Sign out': 'Salir', 'Companions': 'Compañeros', 'Needs you': 'Te necesitan',
    'Conversation': 'Conversación', 'Screen': 'Pantalla', 'Allow': 'Permitir', 'Deny': 'Denegar',
    'This page only watches: it shows everything but does nothing.': 'Esta página solo mira: lo enseña todo pero no hace nada.',
    'Its terminal, as text: the last 80 lines.': 'Su terminal, en texto: las últimas 80 líneas.',
    'Free': 'Libre', 'Working…': 'Trabajando…', 'Asks you': 'Te pregunta', 'Not started': 'Sin levantar', 'Shell': 'Terminal', 'Paused': 'Retenido',
    'wants to run': 'quiere usar', 'asks': 'pregunta', 'a routine': 'una rutina',
    'Write to %s…': 'Escribe a %s…', 'Stop': 'Parar', 'Hold the mailbox': 'Retener', 'Let it go on': 'Dejar seguir',
    'Waiting': 'Esperando', 'First': 'Primero', 'Remove': 'Quitar', 'Show all': 'Ver entero', 'Show less': 'Ver menos',
    'Sent: it gets it as soon as it is free': 'Enviado: le llega en cuanto esté libre', 'Sent': 'Enviado',
    'No companions yet': 'Aún no hay compañeros', 'A terminal opened with a name (pleamar-wm link open --name) shows up here.': 'Aquí sale cada terminal abierta con nombre (pleamar-wm link open --name).',
    'Nothing yet. Write the first task below.': 'Nada todavía. Escribe abajo la primera tarea.',
    'Not started: your letter waits for it, and your desktop may start it.': 'No está levantado: tu carta le espera, y tu escritorio puede levantarlo.',
    'No terminal open.': 'No tiene terminal abierta.', 'No connection with the desktop': 'Sin conexión con el escritorio',
    'Stopped (Ctrl+C)': 'Parado (Ctrl+C)', 'Answered': 'Contestado', 'Allowed': 'Permitido', 'Denied': 'Denegado',
    'It took too long': 'Tardó demasiado', 'Its terminal closed': 'Se cerró su terminal', 'Lost when the session ended': 'Se perdió al cerrarse la sesión', 'It did not take the letter': 'No cogió la carta', 'from %s': 'de %s', 'Today': 'Hoy', 'Yesterday': 'Ayer', 'waits %d': '%d esperan',
    'routine': 'rutina', 'table': 'mesa', 'Removed': 'Quitada', 'It goes first': 'Va la primera', 'Held: nothing more is handed to it': 'Retenido: no le llega nada más', 'It goes on': 'Sigue',
    'What do you open?': '¿Qué abres?',
    'Notices': 'Avisos', 'Close': 'Cerrar', 'Try it': 'Probar', 'Turn off': 'Desactivar', 'Turn notices on': 'Activar avisos',
    'Only when I am not at the computer': 'Solo cuando no estoy en el ordenador',
    'Two minutes without touching it. What needed you meanwhile comes when you leave.': 'Dos minutos sin tocarlo. Lo que te necesitó mientras tanto te llega al irte.',
    'Also when one finishes': 'También cuando alguien termina',
    'Not only when they need you: when they answer a letter too.': 'No solo cuando te necesitan: también cuando contestan una carta.',
    'On this phone, a notice when a companion needs you: what waits for your permission, and what one asks you.': 'En este móvil, un aviso cuando un compañero te necesite: lo que espera tu permiso y lo que te pregunta.',
    'Notices are on on this phone.': 'Los avisos están activados en este móvil.',
    'This browser cannot get notices.': 'Este navegador no puede recibir avisos.',
    'On an iPhone, notices come to the page on the home screen: Share › Add to Home Screen, and open it from there.': 'En el iPhone, los avisos llegan a la página de la pantalla de inicio: Compartir › Añadir a pantalla de inicio, y ábrela desde allí.',
    'Notices are blocked for this page: allow them in the browser\'s settings for the site.': 'Los avisos están bloqueados para esta página: permítelos en los ajustes del sitio en el navegador.',
    'Notices on': 'Avisos activados', 'Notices off': 'Avisos desactivados', 'Sent: it should be here in a moment': 'Enviado: te llegará en un momento',
    'Waiting for you to allow it': 'Te espera para seguir', 'Its answer': 'Su respuesta', 'nothing yet': 'nada aún',
  };
  const t = (s, ...a) => { let o = (ES && T[s]) || s; for (const x of a) o = o.replace(/%[sd]/, x); return o; };
  if (ES) { document.documentElement.lang = 'es'; document.title = 'Caravana'; }
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  $('host').textContent = location.hostname;
  if (WATCH) $('watch-note').hidden = false;

  // ---- Glyphs: a name's card says it; without one, one from its name (as Calima makes them).
  function nameGlyph(name) {
    let h = 5381;
    for (const b of new TextEncoder().encode(name)) h = (h * 33 + b) % 2147483647;
    const rows = [];
    for (let r = 0; r < 5; r++) {
      const b = Math.floor(h / 8 ** r) % 8, c0 = b % 2, c1 = (b >> 1) % 2, c2 = (b >> 2) % 2;
      rows.push(c0 + 2 * c1 + 4 * c2 + 8 * c1 + 16 * c0);
    }
    if (!rows[2]) rows[2] = 4;
    return rows;
  }
  function nameColor(name) {
    let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) >>> 0;
    return `hsl(${h % 360} 45% 68%)`;
  }
  const look = c => {
    const card = c.card || {};
    const g = Array.isArray(card.glyph) && card.glyph.length === 5 ? card.glyph : nameGlyph(c.name);
    return { title: card.title || c.name, color: card.color || nameColor(c.name), glyph: g, sub: card.sub || '' };
  };
  function avatar(c, into) {
    const l = look(c), a = into || el('div', 'avatar');
    a.replaceChildren();
    a.className = 'avatar s-' + (c.state || 'away');
    a.style.color = l.color;
    const g = el('div', 'glyph');
    for (let r = 0; r < 5; r++) for (let k = 0; k < 5; k++) g.append(el('i', (l.glyph[r] >> k) & 1 ? 'on' : ''));
    a.append(g, el('span', 'dot'));
    return a;
  }
  const HOW = { late: 'It took too long', gone: 'Its terminal closed', lost: 'Lost when the session ended', refused: 'It did not take the letter' };
  // Who a letter is from: a routine, a table, another companion.
  const fromText = f => byName(f) ? look(byName(f)).title : f.replace(/^routine /, t('routine') + ' ').replace(/^table /, t('table') + ' ');
  const STATE = { free: 'Free', working: 'Working…', asking: 'Asks you', away: 'Not started', shell: 'Shell' };
  const stateText = c => c.paused && c.state !== 'asking' ? t('Paused') : t(STATE[c.state] || c.state);

  // ---- Talking to the desktop.
  let toastTimer;
  function toast(s) { const e = $('toast'); e.textContent = s; e.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.remove('show'), 2600); }
  async function get(path) {
    const r = await fetch(path, { cache: 'no-store', credentials: 'same-origin' });
    if (r.status === 401) { location.href = '/'; throw new Error('signed out'); }
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }
  async function act(what, okText) {
    if (WATCH) return false;
    try {
      const r = await fetch('/caravan/do', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(what) });
      const said = await r.text();
      if (r.status === 401) { location.href = '/'; return false; }
      toast(r.ok ? (okText || said) : said);
      if (navigator.vibrate) navigator.vibrate(r.ok ? 12 : [20, 40, 20]);
      refresh();
      return r.ok;
    } catch (_) { toast(t('No connection with the desktop')); return false; }
  }

  // ---- Home: what needs you, and everyone.
  let state = { companions: [], pending: [] };
  let open = null; // the name whose conversation is open
  const byName = n => state.companions.find(c => c.name === n);

  function questionCard(c, compact) {
    const q = c.question, card = el('div', 'card needs');
    const who = el('div', 'who'); who.append(avatar(c));
    const w = el('div'); w.append(el('b', '', look(c).title), el('div', 'meta', t('asks')));
    who.append(w); card.append(who);
    card.append(el('div', 'q', q.text));
    if (!compact && Array.isArray(c.detail) && c.detail.length) card.append(el('div', 'what', c.detail.join('\n')));
    const btns = el('div', 'row-btns');
    for (const o of q.options || []) {
      const b = el('button', 'btn opt' + (o.n === 1 ? ' go' : ''), `${o.n}. ${o.text}`);
      b.disabled = WATCH;
      b.onclick = () => { btns.querySelectorAll('button').forEach(x => x.disabled = true); act({ do: 'answer', name: c.name, n: o.n, key: q.key }, t('Answered')); };
      btns.append(b);
    }
    card.append(btns);
    return card;
  }
  function gateCard(p) {
    const c = byName(p.name) || { name: p.name || p.agent || '?' };
    const card = el('div', 'card needs');
    const who = el('div', 'who'); who.append(avatar(c));
    const w = el('div'); w.append(el('b', '', look(c).title), el('div', 'meta', `${t('wants to run')} ${p.tool || ''}${p.routine ? ' · ' + t('a routine') : ''}`));
    who.append(w); card.append(who);
    card.append(el('div', 'what', p.what || ''));
    const btns = el('div', 'row-btns');
    const yes = el('button', 'btn go', t('Allow')), no = el('button', 'btn no', t('Deny'));
    yes.disabled = no.disabled = WATCH;
    yes.onclick = () => { yes.disabled = no.disabled = true; act({ do: 'gate', id: p.id, verdict: 'allow' }, t('Allowed')); };
    no.onclick = () => { yes.disabled = no.disabled = true; act({ do: 'gate', id: p.id, verdict: 'deny' }, t('Denied')); };
    btns.append(no, yes); card.append(btns);
    return card;
  }
  function drawHome() {
    const needs = $('needs'); needs.replaceChildren();
    const asking = state.companions.filter(c => c.question);
    if (state.pending.length || asking.length) {
      needs.append(el('h2', '', t('Needs you')));
      state.pending.forEach(p => needs.append(gateCard(p)));
      asking.forEach(c => needs.append(questionCard(c)));
    }
    const list = $('list'); list.replaceChildren();
    if (!state.companions.length) {
      const e = el('div', 'empty'); e.append(el('b', '', t('No companions yet')), el('span', '', t('A terminal opened with a name (pleamar-wm link open --name) shows up here.')));
      list.append(e);
    }
    for (const c of state.companions) {
      const row = el('button', 'comp s-' + c.state);
      row.append(avatar(c));
      const body = el('div', 'body'), top = el('div', 'top');
      top.append(el('span', 'name', look(c).title));
      if (c.waiting) top.append(el('span', 'badge', String(c.waiting)));
      top.append(el('span', 'state', stateText(c)));
      body.append(top, el('div', 'line', c.question ? c.question.text : c.doing || unlink(c.last || '') || look(c).sub || ''));
      row.append(body);
      row.onclick = () => openTalk(c.name);
      list.append(row);
    }
  }

  // ---- A conversation: its letters and what each got back.
  let talk = null, tab = 'chat', expanded = new Set();
  const when = ms => {
    if (!ms) return '';
    const d = new Date(ms), now = new Date(), y = new Date(now - 864e5);
    const hm = d.toLocaleTimeString(ES ? 'es' : undefined, { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return hm;
    if (d.toDateString() === y.toDateString()) return `${t('Yesterday')} ${hm}`;
    return `${d.toLocaleDateString(ES ? 'es' : undefined, { day: 'numeric', month: 'short' })} ${hm}`;
  };
  // The pictures an answer names (`/…/fondo.png`, or a Markdown link to one): shown under it, from the server
  // (`/caravan/file`, which gives only those a letter names). A link shows its words, not its path.
  const PIC = /(\/[^\s)\]"'<>`]+\.(?:png|jpe?g|webp|gif))/gi;
  const unlink = text => text.replace(/\[([^\]]+)\]\((\/[^)\s]+)\)/g, '$1');
  function pictures(bub, text) {
    const seen = new Set();
    for (const m of text.matchAll(PIC)) {
      const p = m[1];
      if (seen.has(p)) continue;
      seen.add(p);
      const url = '/caravan/file?path=' + encodeURIComponent(p);
      const a = el('a', 'pic'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
      const img = el('img'); img.src = url; img.loading = 'lazy'; img.alt = p.split('/').pop();
      img.onerror = () => a.remove();
      a.append(img); bub.append(a);
    }
  }
  function longText(bub, text, key) {
    const LIMIT = 900;
    if (text.length <= LIMIT) { bub.append(document.createTextNode(text)); return; }
    const full = expanded.has(key);
    bub.append(document.createTextNode(full ? text : text.slice(0, LIMIT).replace(/\s+\S*$/, '') + '…'));
    const m = el('button', 'more', full ? t('Show less') : t('Show all'));
    m.onclick = () => { full ? expanded.delete(key) : expanded.add(key); loadTalk.seen = ''; drawChat(); };
    bub.append(m);
  }
  function drawChat() {
    const chat = $('chat'), sc = $('t-scroll');
    const atEnd = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 60;
    chat.replaceChildren();
    const c = byName(open) || { name: open, state: 'away' };
    const asks = $('asks'); asks.replaceChildren();
    if (c.question) asks.append(questionCard(c, false));
    for (const p of state.pending.filter(p => p.name === open)) asks.append(gateCard(p));
    const letters = (talk && talk.letters) || [];
    if (!letters.length) {
      const e = el('div', 'empty'); e.append(el('span', '', c.state === 'away' ? t('Not started: your letter waits for it, and your desktop may start it.') : t('Nothing yet. Write the first task below.')));
      chat.append(e);
    }
    let lastDay = '';
    for (const l of letters) {
      const day = l.at ? new Date(l.at).toDateString() : '';
      if (day && day !== lastDay) { lastDay = day; chat.append(el('div', 'day', day === new Date().toDateString() ? t('Today') : new Date(l.at).toLocaleDateString(ES ? 'es' : undefined, { weekday: 'long', day: 'numeric', month: 'long' }))); }
      const mine = el('div', 'bub me' + (l.state === 'waiting' ? ' waiting' : ''));
      if (l.from) mine.append(el('span', 'from', t('from %s', fromText(l.from))));
      longText(mine, l.text || '', 'q' + l.id);
      chat.append(mine);
      if (l.state === 'waiting') {
        const wb = el('div', 'wbtns');
        wb.append(el('span', '', t('Waiting')));
        if (!WATCH) {
          const first = el('button', '', t('First')), rm = el('button', 'no', t('Remove'));
          first.onclick = () => act({ do: 'first', name: open, id: l.id }, t('It goes first'));
          rm.onclick = () => act({ do: 'cancel', name: open, id: l.id }, t('Removed'));
          wb.append(first, rm);
        }
        chat.append(wb);
        continue;
      }
      chat.append(el('div', 'stamp me', when(l.at)));
      if (l.state !== 'done') { const ty = el('div', 'typing'); ty.append(el('i'), el('i'), el('i')); chat.append(ty); continue; }
      const bad = l.how && l.how !== 'done';
      const them = el('div', 'bub them' + (bad ? ' bad' : ''));
      if (bad) them.append(el('span', 'from', t(HOW[l.how] || l.how)));
      longText(them, unlink((l.answer || '').trim()) || '—', 'a' + l.id);
      pictures(them, l.answer || '');
      chat.append(them, el('div', 'stamp them', when(l.ended)));
    }
    if (atEnd || drawChat.first) { sc.scrollTop = sc.scrollHeight; drawChat.first = false; }
  }
  function drawTalkHead() {
    const c = byName(open) || { name: open, state: 'away' };
    avatar(c, $('t-av')); $('t-av').className = 'avatar s-' + c.state;
    $('t-name').textContent = look(c).title;
    const extra = [look(c).sub, c.waiting ? t('waits %d', c.waiting) : ''].filter(Boolean).join(' · ');
    $('t-state').textContent = stateText(c) + (extra ? ' · ' + extra : '');
    $('box').placeholder = t('Write to %s…', look(c).title);
    const tools = $('tools'); tools.replaceChildren();
    if (WATCH) return;
    if (c.state === 'working' || c.state === 'asking') {
      const s = el('button', 'chip no', t('Stop')); s.onclick = () => act({ do: 'stop', name: open }, t('Stopped (Ctrl+C)')); tools.append(s);
    }
    const p = el('button', 'chip', c.paused ? t('Let it go on') : t('Hold the mailbox'));
    p.onclick = () => act({ do: c.paused ? 'resume' : 'pause', name: open }, c.paused ? t('It goes on') : t('Held: nothing more is handed to it')); tools.append(p);
  }
  async function loadTalk() {
    if (!open) return;
    try {
      const got = await get('/caravan/talk?name=' + encodeURIComponent(open));
      if (got.name !== open) return;
      // (Drawn again only when something changed: a tap on it is not lost under a fresh copy.)
      const c = byName(open) || {};
      const seen = JSON.stringify([got, c.question, c.detail, state.pending.filter(p => p.name === open).map(p => p.id), [...expanded]]);
      if (seen === loadTalk.seen && !drawChat.first) return;
      loadTalk.seen = seen; talk = got; drawChat();
    } catch (_) {}
  }
  async function loadScreen() {
    if (!open || tab !== 'screen') return;
    try {
      const got = await get('/caravan/screen?name=' + encodeURIComponent(open));
      const pre = $('screen'), sc = $('t-scroll'), atEnd = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 60;
      pre.textContent = got.up ? got.text : t('No terminal open.');
      if (atEnd) sc.scrollTop = sc.scrollHeight;
    } catch (_) {}
  }
  function openTalk(name, fromHistory) {
    open = name; talk = null; expanded.clear(); drawChat.first = true; loadTalk.seen = '';
    $('chat').replaceChildren(); $('asks').replaceChildren(); $('screen').textContent = '';
    setTab('chat');
    document.body.classList.add('in-talk'); $('talk').setAttribute('aria-hidden', 'false');
    if (!fromHistory) history.pushState({ talk: name }, '', '#' + encodeURIComponent(name));
    drawTalkHead(); loadTalk(); restartTimers();
  }
  function closeTalk() {
    open = null; document.body.classList.remove('in-talk'); $('talk').setAttribute('aria-hidden', 'true'); $('box').blur(); restartTimers();
  }
  $('back').onclick = () => (history.state && history.state.talk ? history.back() : (history.replaceState(null, '', location.pathname), closeTalk()));
  addEventListener('popstate', e => { if (e.state && e.state.talk) openTalk(e.state.talk, true); else closeTalk(); });
  function setTab(which) {
    tab = which;
    $('tab-chat').classList.toggle('on', which === 'chat'); $('tab-screen').classList.toggle('on', which === 'screen');
    $('chat').hidden = $('asks').hidden = which !== 'chat'; $('screen-wrap').hidden = which !== 'screen';
    if (which === 'screen') { loadScreen(); } else { drawChat.first = true; drawChat(); }
    restartTimers();
  }
  $('tab-chat').onclick = () => setTab('chat');
  $('tab-screen').onclick = () => setTab('screen');

  // ---- Writing to it.
  const box = $('box'), send = $('send');
  if (WATCH) { $('t-foot').replaceChildren(el('div', 'watch-only', t('This page only watches: it shows everything but does nothing.'))); }
  const fit = () => { box.style.height = 'auto'; box.style.height = Math.min(box.scrollHeight + 2, 160) + 'px'; send.disabled = !box.value.trim(); };
  box.addEventListener('input', fit);
  box.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer: coarse)').matches) { e.preventDefault(); go(); } });
  async function go() {
    const text = box.value.trim();
    if (!text || !open) return;
    send.disabled = true;
    const c = byName(open);
    const ok = await act({ do: 'post', name: open, text }, c && c.state === 'free' ? t('Sent') : t('Sent: it gets it as soon as it is free'));
    if (ok) { box.value = ''; fit(); drawChat.first = true; loadTalk(); } else send.disabled = false;
  }
  send.onclick = go;

  // ---- Notices to this phone (Web Push): its service worker shows them; the server sends them encrypted for it.
  const PUSH = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const IOS = /iPhone|iPad/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  const STANDALONE = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone;
  let reg = null;
  if (PUSH) navigator.serviceWorker.register('/sw.js').then(r => { reg = r; pushState(); }).catch(() => {});
  const keyBytes = k => { const b = atob(k.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - k.length % 4) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
  async function pushPost(what) {
    const r = await fetch('/caravan/push', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(what) });
    const said = await r.text();
    if (!r.ok) throw new Error(said);
    return said;
  }
  async function currentSub() { try { return reg ? await reg.pushManager.getSubscription() : null; } catch (_) { return null; } }
  async function pushState() {
    const sub = await currentSub();
    let st = { on: false };
    if (sub) { try { st = JSON.parse(await pushPost({ do: 'state', endpoint: sub.endpoint })); } catch (_) {} }
    $('bell').classList.toggle('on', !!st.on);
    $('sh-on').hidden = !st.on; $('sh-test').hidden = !st.on; $('sh-off').hidden = !st.on;
    if (st.on) { $('sw-away').checked = st.away_only !== false; $('sw-done').checked = !!st.finished; }
    let text, canOn = false;
    if (!PUSH) text = IOS && !STANDALONE ? t('On an iPhone, notices come to the page on the home screen: Share › Add to Home Screen, and open it from there.') : t('This browser cannot get notices.');
    else if (Notification.permission === 'denied') text = t("Notices are blocked for this page: allow them in the browser's settings for the site.");
    else if (st.on) text = t('Notices are on on this phone.');
    else { text = t('On this phone, a notice when a companion needs you: what waits for your permission, and what one asks you.'); canOn = true; }
    $('sh-text').textContent = text;
    $('sh-go').hidden = !canOn;
    return st;
  }
  function sheet(show) {
    $('sheet').classList.toggle('show', show); $('scrim').classList.toggle('show', show);
    $('sheet').setAttribute('aria-hidden', show ? 'false' : 'true');
    if (show) { pushState(); setTimeout(() => ($('sh-go').hidden ? $('sh-close') : $('sh-go')).focus(), 250); } else $('bell').focus();
  }
  $('bell').setAttribute('aria-label', t('Notices'));
  $('bell').onclick = () => sheet(true);
  $('sh-close').onclick = $('scrim').onclick = () => sheet(false);
  addEventListener('keydown', e => { if (e.key === 'Escape' && $('sheet').classList.contains('show')) sheet(false); });
  $('sh-go').onclick = async () => {
    $('sh-go').disabled = true;
    try {
      if ((await Notification.requestPermission()) !== 'granted') { await pushState(); return; }
      reg = reg || await navigator.serviceWorker.ready;
      const key = await (await fetch('/caravan/push/key', { credentials: 'same-origin' })).text();
      const sub = (await currentSub()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(key.trim()) });
      await pushPost({ do: 'subscribe', sub: sub.toJSON(), away_only: true, finished: false, lang: ES ? 'es' : 'en' });
      toast(t('Notices on'));
    } catch (e) { toast(String(e.message || e)); }
    $('sh-go').disabled = false;
    pushState();
  };
  const setting = async () => {
    const sub = await currentSub(); if (!sub) return;
    try { await pushPost({ do: 'settings', endpoint: sub.endpoint, away_only: $('sw-away').checked, finished: $('sw-done').checked }); } catch (e) { toast(String(e.message || e)); }
  };
  $('sw-away').onchange = $('sw-done').onchange = setting;
  $('sh-test').onclick = async () => {
    const sub = await currentSub(); if (!sub) return;
    try { await pushPost({ do: 'test', endpoint: sub.endpoint }); toast(t('Sent: it should be here in a moment')); } catch (e) { toast(String(e.message || e)); pushState(); }
  };
  $('sh-off').onclick = async () => {
    const sub = await currentSub();
    if (sub) { try { await pushPost({ do: 'unsubscribe', endpoint: sub.endpoint }); } catch (_) {} try { await sub.unsubscribe(); } catch (_) {} }
    toast(t('Notices off')); pushState();
  };

  // ---- Keeping up: every few seconds while in sight, nothing while hidden.
  async function refresh() {
    try {
      const got = await get('/caravan/state'), seen = JSON.stringify({ ...got, at: 0 });
      document.body.classList.remove('offline');
      state = got;
      if (seen !== refresh.seen) { refresh.seen = seen; drawHome(); }
      if (open) { drawTalkHead(); loadTalk(); }
    } catch (e) {
      if (e.message !== 'signed out') { $('offline').textContent = t('No connection with the desktop'); document.body.classList.add('offline'); }
    }
  }
  let timers = [];
  function restartTimers() {
    timers.forEach(clearInterval); timers = [];
    if (document.hidden) return;
    timers.push(setInterval(refresh, open ? 2500 : 3500));
    if (open && tab === 'screen') timers.push(setInterval(loadScreen, 2000));
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); restartTimers(); });
  addEventListener('online', refresh);

  refresh().then(() => {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h) { history.replaceState({ talk: h }, '', location.hash); openTalk(h, true); }
  });
  restartTimers();
})();
</script>
</body>
</html>
