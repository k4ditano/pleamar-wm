[package]
name = "pleamar-wm-stream"
version = "0.3.8"
edition = "2024"
license = "BSD-3-Clause"
description = "A monitor as low-latency H.264 for pleamar-wm remote: wlr-screencopy in, ffmpeg's encoder out"
repository = "https://github.com/k4ditano/pleamar-wm"

[dependencies]
libc = "0.2"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# The system's ffmpeg (libavcodec, libswscale): the card's encoder (NVENC) or x264.
ffmpeg-sys-next = "9"
